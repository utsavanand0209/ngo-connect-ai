services:
  - type: web
    name: ngo-connect-backend
    env: node
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard
      - key: POSTGRES_URL
        fromDatabase:
          name: ngo-connect-db
          property: connectionString
databases:
  - name: ngo-connect-db
    databaseName: ngo_connect
    user: admin
