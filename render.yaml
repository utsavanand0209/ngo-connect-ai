services:
  - type: web
    name: ngo-connect-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard
      - key: POSTGRES_URL
        sync: false # Set this manually to your Supabase session pooler URI
